<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darwin Developer — Full-Stack Developer (React + .NET)</title>
    <meta
      name="description"
      content="Portfolio of Darwin Developer, Full-Stack Developer specializing in React 19, TypeScript, and .NET Core enterprise systems."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#131315" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Darwin Developer — Full-Stack Developer (React + .NET)" />
    <meta
      property="og:description"
      content="Portfolio of Darwin Developer, Full-Stack Developer specializing in React 19, TypeScript, and .NET Core enterprise systems."
    />
    <meta property="og:image" content="/og-default.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Darwin Developer — Full-Stack Developer (React + .NET)" />
    <meta
      name="twitter:description"
      content="Portfolio of Darwin Developer, Full-Stack Developer specializing in React 19, TypeScript, and .NET Core enterprise systems."
    />
    <meta name="twitter:image" content="/og-default.svg" />

    <!-- JSON-LD Person Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Darwin Developer",
        "jobTitle": "Full-Stack Developer (React + .NET)",
        "url": "https://example.com",
        "sameAs": ["https://github.com/example", "https://linkedin.com/in/example"]
      }
    </script>
    <script>
      ;(function () {
        try {
          var key = 'portfolio-theme'
          var choice = localStorage.getItem(key)
          var valid = ['light', 'dark', 'system']
          if (!choice || valid.indexOf(choice) === -1) {
            choice = 'system'
          }
          var resolved = choice
          if (choice === 'system') {
            var mql = window.matchMedia('(prefers-color-scheme: dark)')
            resolved = mql.matches ? 'dark' : 'light'
          }
          var doc = document.documentElement
          doc.setAttribute('data-theme', resolved)
          doc.setAttribute('data-theme-choice', choice)
          doc.style.colorScheme = resolved === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.setAttribute('data-theme-choice', 'system')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
