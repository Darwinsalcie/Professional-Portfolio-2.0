<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="glow" cx="600" cy="315" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#131315" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B7C4FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#131315"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border hairline frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Content -->
  <g transform="translate(100, 140)">
    <!-- Monogram / Eyebrow -->
    <rect width="48" height="48" rx="12" fill="#1D4ED8"/>
    <text x="24" y="29" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="20">DP</text>
    <text x="70" y="29" fill="#7BD0FF" font-family="monospace" font-size="16" letter-spacing="0.1em" dominant-baseline="middle">DARWIN // PORTFOLIO 2.0</text>

    <!-- Main Title -->
    <text x="0" y="140" fill="url(#textGrad)" font-family="system-ui, sans-serif" font-weight="700" font-size="64" letter-spacing="-0.03em">
      Full-Stack Developer
    </text>
    <text x="0" y="210" fill="#7BD0FF" font-family="system-ui, sans-serif" font-weight="600" font-size="48" letter-spacing="-0.02em">
      React 19 + .NET High-Performance Systems
    </text>

    <!-- Subtitle / Lede -->
    <text x="0" y="290" fill="#8E90A0" font-family="system-ui, sans-serif" font-size="24" font-weight="400">
      Enterprise architectures, verified accessibility, and bespoke web solutions.
    </text>

    <!-- Tech specs footer badge -->
    <rect y="360" width="460" height="40" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="20" y="384" fill="#E5E1E4" font-family="monospace" font-size="16" dominant-baseline="middle">
      VITE 8 · REACT 19 · TYPESCRIPT · TAILWIND 4
    </text>
  </g>
</svg>
